<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GSR Chats Hub | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff', green: '#10B981' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
        .chat-bubble { max-width: 85%; }
        .scroll-touch { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased h-[100dvh] flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-brand-card border-b border-brand-gold relative py-3 shadow-xl flex-shrink-0 z-20">
        <div class="max-w-[1400px] mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html"><img src="logo.png" alt="GSR Logo" class="h-10 w-auto object-contain"></a>
                <div class="hidden sm:block border-l border-brand-border pl-4">
                    <h1 class="text-lg font-black uppercase text-brand-gold tracking-wider font-serif italic">GSR Comms Network</h1>
                    <span class="text-[9px] text-gray-400 uppercase tracking-widest">Verified Drivers Only</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <span class="block text-xs font-black text-white">Deathstalker Paine</span>
                    <span class="text-[9px] text-brand-green uppercase font-mono">Status: Cleared to Race</span>
                </div>
                <a href="admin.html" class="bg-brand-bg border border-brand-border hover:border-brand-red text-white text-[10px] uppercase font-black px-4 py-2 rounded transition">Sign Out</a>
            </div>
        </div>
    </header>

    <!-- SUB-NAVBAR -->
    <nav class="bg-[#0a0a0a] border-b border-brand-border py-2 flex-shrink-0 z-10">
        <div class="max-w-[1400px] mx-auto px-4 flex gap-6 text-[10px] font-black uppercase tracking-wider overflow-x-auto scroll-touch whitespace-nowrap">
            <a href="index.html" class="text-gray-500 hover:text-brand-gold transition">Main Menu</a>
            <a href="chats.html" class="text-brand-gold underline decoration-2 underline-offset-4">GSR Chats</a>
            <a href="racers.html" class="text-gray-500 hover:text-brand-gold transition">Racer Directory</a>
            <a href="teams.html" class="text-gray-500 hover:text-brand-gold transition">Team Hub</a>
        </div>
    </nav>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow flex max-w-[1400px] w-full mx-auto px-2 sm:px-4 py-4 gap-4 min-h-0">

        <!-- LEFT SIDEBAR: THE 4 CHANNELS -->
        <aside class="w-64 flex flex-col gap-4 flex-shrink-0 hidden md:flex min-h-0">
            <div class="bg-brand-card border border-brand-green/30 rounded-lg p-3 flex-shrink-0">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></div>
                    <span class="text-[10px] font-black uppercase text-brand-green tracking-widest">Access Granted</span>
                </div>
            </div>

            <div class="bg-brand-card border border-brand-border rounded-lg p-2 flex-grow overflow-y-auto scroll-touch">
                <span class="text-[9px] font-black uppercase text-gray-500 tracking-widest px-2 mb-2 block">Network Feeds</span>
                
                <button onclick="switchChannel('global', this)" class="channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase bg-brand-gold text-black transition flex justify-between items-center mb-1 font-black shadow">
                    <span>🌐 Global Chat</span>
                </button>
                <button onclick="switchChannel('following', this)" class="channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase text-gray-400 hover:bg-brand-bg transition flex justify-between items-center mb-1">
                    <span>👥 Following</span>
                </button>
                <button onclick="switchChannel('team', this)" class="channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase text-gray-400 hover:bg-brand-bg transition flex justify-between items-center mb-1">
                    <span>🛡️ Team Chat</span>
                </button>
                <button onclick="switchChannel('pro_plus', this)" class="channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase text-gray-400 hover:bg-brand-bg transition flex justify-between items-center mb-4">
                    <span>⭐ Pro Plus</span>
                </button>
            </div>
        </aside>

        <!-- CENTER CHAT WINDOW -->
        <section class="flex-grow flex flex-col bg-brand-card border border-brand-border rounded-lg shadow-2xl overflow-hidden min-h-0">
            <div class="bg-brand-bg border-b border-brand-border p-3 sm:p-4 flex justify-between items-center flex-shrink-0">
                <div>
                    <h2 id="channelTitle" class="text-sm font-black uppercase text-white">🌐 Global Chat</h2>
                    <p id="channelDesc" class="text-[10px] text-gray-400">Public broadcast for all verified racers.</p>
                </div>
            </div>

            <div id="messagesArea" class="flex-grow p-4 overflow-y-auto scroll-touch space-y-4 font-sans flex flex-col">
                <!-- Messages JS Injected Here -->
            </div>

            <div class="bg-[#151515] border-t border-brand-border p-3 sm:p-4 flex flex-col gap-2 flex-shrink-0">
                <div class="flex items-center gap-2 text-[9px] text-gray-500 font-mono">
                    <span class="text-brand-red font-bold">⚠️ MODERATION ACTIVE.</span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="Type your message here..." class="flex-grow bg-[#0a0a0a] border border-brand-border text-white text-sm px-4 py-3 rounded outline-none focus:border-brand-gold transition placeholder-gray-600">
                    <button onclick="sendMessage()" class="bg-brand-gold hover:bg-yellow-600 text-black font-black uppercase text-xs px-5 sm:px-8 py-3 rounded transition shadow shrink-0">Send ↵</button>
                </div>
            </div>
        </section>
    </main>

    <!-- PERSISTENT CHAT SCRIPT ENGINE -->
    <script>
        const defaultChatData = {
            global: [{ id: 1, racer: "Vortex_SL", isMe: false, time: "14:02", text: "Lobby is open for Rome." }],
            following: [],
            team: [],
            pro_plus: [{ id: 2, racer: "Admin", isMe: false, time: "09:00", text: "Welcome to the Pro Plus exclusive chat." }]
        };

        let chatData = JSON.parse(localStorage.getItem('gsr_chat_network')) || defaultChatData;
        let activeChannel = 'global';

        window.addEventListener('storage', (e) => {
            if(e.key === 'gsr_chat_network') {
                chatData = JSON.parse(e.newValue);
                renderMessages();
            }
        });

        function switchChannel(channel, btn) {
            activeChannel = channel;
            
            document.querySelectorAll('.channel-btn').forEach(b => {
                b.className = "channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase text-gray-400 hover:bg-brand-bg transition flex justify-between items-center mb-1";
            });
            btn.className = "channel-btn w-full text-left px-3 py-2.5 rounded text-xs font-bold uppercase bg-brand-gold text-black transition flex justify-between items-center mb-1 font-black shadow";

            const headers = {
                global: { title: "🌐 Global Chat", desc: "Public broadcast for all verified racers." },
                following: { title: "👥 Following", desc: "Feed from racers and teams you follow." },
                team: { title: "🛡️ Team Chat", desc: "Encrypted channel visible ONLY to your team." },
                pro_plus: { title: "⭐ Pro Plus Lounge", desc: "Exclusive channel for GSR Pro Plus subscribers." }
            };
            
            document.getElementById('channelTitle').innerText = headers[channel].title;
            document.getElementById('channelDesc').innerText = headers[channel].desc;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';
            const messages = chatData[activeChannel] || [];

            if(messages.length === 0) {
                container.innerHTML = `<div class="m-auto text-center text-gray-500 font-bold uppercase text-[10px]">[ Channel is quiet ]</div>`;
                return;
            }

            messages.forEach(msg => {
                const alignClass = msg.isMe ? "self-end items-end" : "self-start items-start";
                const bgClass = msg.isMe ? "bg-brand-gold/10 border border-brand-gold text-white" : "bg-[#1f1f1f] border border-brand-border text-gray-200";
                
                container.innerHTML += `
                    <div class="flex flex-col ${alignClass} chat-bubble">
                        <div class="flex items-center gap-2 mb-1 text-[10px]">
                            <a href="racers_profiles.html?user=${msg.racer.toLowerCase()}" class="font-black ${msg.isMe ? 'text-brand-gold' : 'text-brand-blue'} hover:underline uppercase tracking-wider">${msg.racer}</a>
                        </div>
                        <div class="${bgClass} px-3 py-2 rounded-lg text-xs leading-relaxed break-words shadow-sm">
                            <span class="msg-content">${msg.text}</span>
                        </div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if(!val) return;

            if(!chatData[activeChannel]) chatData[activeChannel] = [];
            
            chatData[activeChannel].push({
                id: Date.now(),
                racer: "Deathstalker Paine",
                isMe: true,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                text: val,
                lang: "en"
            });

            localStorage.setItem('gsr_chat_network', JSON.stringify(chatData));
            input.value = '';
            renderMessages();
        }

        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        window.onload = () => renderMessages();
    </script>
</body>
</html>
