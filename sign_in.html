<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', green: '#10B981' } } } } }
    </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4" style="background-image: radial-gradient(circle at 50% -20%, #1a1a1a, #121212);">

    <div class="max-w-sm w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html"><img src="logo.png" alt="GSR Logo" class="h-16 mx-auto mb-4 object-contain"></a>
            <h1 class="text-2xl font-black uppercase tracking-widest text-white">Network Login</h1>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-xl shadow-2xl p-6 sm:p-8">
            <div class="space-y-5">
                <div>
                    <label class="block text-[9px] font-black uppercase text-gray-500 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-sm px-4 py-3 rounded outline-none focus:border-brand-gold transition">
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[9px] font-black uppercase text-gray-500">Password</label>
                    </div>
                    <input type="password" id="loginPassword" onkeypress="if(event.key === 'Enter') executeLogin()" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-sm px-4 py-3 rounded outline-none focus:border-brand-gold transition">
                </div>

                <button type="button" id="loginBtn" onclick="executeLogin()" class="w-full bg-white hover:bg-gray-200 text-black font-black uppercase text-xs py-4 rounded transition shadow-lg mt-2 cursor-pointer">
                    Sign In →
                </button>

                <p id="statusMsg" class="text-center text-xs font-bold mt-2"></p>
            </div>
        </div>
    </div>

    <!-- 1. Load Supabase Library at the bottom -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. The Cache Buster: Forces the browser to download the NEW file -->
    <script src="gsr_db.js?v=2"></script>

    <!-- The Auth Script -->
    <script>
        async function executeLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const statusMsg = document.getElementById('statusMsg');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                statusMsg.innerText = "Please enter both email and password.";
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-red";
                return;
            }

            loginBtn.innerHTML = "Authenticating...";
            loginBtn.disabled = true;
            statusMsg.innerText = "Connecting to network...";
            statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-gold";

            try {
                // FAILSAFE: If the browser is still being stubborn with the cache, build it right here
                if (!window.db && window.supabase) {
                    window.db = window.supabase.createClient('https://xwrfreokngnknftgzglg.supabase.co', 'sb_publishable_n7pgqjIuIeRORwzVZppaMA_3sowuxXw');
                } else if (!window.db) {
                    throw new Error("Critical network error. Supabase library failed to load.");
                }

                const { data, error } = await window.db.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                statusMsg.innerText = "Access Granted! Routing...";
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-green";

                let returnPage = 'index.html';
                if (document.referrer && !document.referrer.includes('sign_')) {
                    returnPage = document.referrer;
                }

                setTimeout(() => {
                    window.location.href = returnPage;
                }, 800);

            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-red";
                loginBtn.innerHTML = "Sign In →";
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
