    <script>
        async function executeLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const statusMsg = document.getElementById('statusMsg');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                statusMsg.innerText = "Please enter both email and password.";
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-red";
                return;
            }

            loginBtn.innerHTML = "Authenticating...";
            loginBtn.disabled = true;
            statusMsg.innerText = "Connecting to network...";
            statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-gold";

            try {
                // Use the safe 'db' connection
                const { data, error } = await window.db.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                statusMsg.innerText = "Access Granted! Routing...";
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-green";

                let returnPage = 'index.html';
                if (document.referrer && !document.referrer.includes('sign_')) {
                    returnPage = document.referrer;
                }

                setTimeout(() => {
                    window.location.href = returnPage;
                }, 800);

            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
                statusMsg.className = "text-center text-xs font-bold mt-2 text-brand-red";
                loginBtn.innerHTML = "Sign In →";
                loginBtn.disabled = false;
            }
        }
    </script>
