    <script>
        async function handleSignIn(e) {
            // 1. Immediately stop the page from refreshing
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            loginBtn.innerHTML = "Authenticating...";
            loginBtn.disabled = true;

            try {
                // 2. Check if Safari loaded the library yet
                if (!window.supabase) {
                    throw new Error("Network connection still loading. Please try again in 2 seconds.");
                }

                // 3. Initialize connection ONLY when button is clicked
                const supabaseUrl = 'https://xwrfreokngnknftgzglg.supabase.co';
                const supabaseKey = 'sb_publishable_n7pgqjIuIeRORwzVZppaMA_3sowuxXw';
                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

                // 4. Sign in
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw new Error(error.message);
                }

                // 5. Success! Route directly to the Chats page
                alert("Access Granted! Routing to GSR Comms Network...");
                window.location.href = "chats.html";

            } catch (err) {
                alert("Login Error: " + err.message);
                loginBtn.innerHTML = "Sign In →";
                loginBtn.disabled = false;
            }
        }
    </script>
