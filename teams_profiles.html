<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profiles | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff', green: '#10B981' } } } } }
    </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <main class="flex-grow max-w-[1400px] w-full mx-auto px-4 py-8">
        
        <!-- SEARCH ENGINE -->
        <div class="bg-brand-card border border-brand-border rounded-xl p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <input type="text" placeholder="SEARCH TEAM NAME & PRESS ENTER..." class="flex-grow bg-[#111] border border-brand-border text-xs text-white px-4 py-3 rounded outline-none focus:border-brand-gold transition">
                <select class="bg-[#111] border border-brand-border text-xs text-gray-400 uppercase font-bold px-4 py-3 rounded outline-none min-w-[200px]">
                    <option>ALL LEAGUES</option>
                </select>
                <select class="bg-[#111] border border-brand-border text-xs text-gray-400 uppercase font-bold px-4 py-3 rounded outline-none min-w-[200px]">
                    <option>ALL ROSTER STATUS</option>
                </select>
            </div>
            
            <!-- A-Z Filter -->
            <div class="flex flex-wrap justify-center gap-1.5">
                <button class="bg-brand-gold text-black font-black text-[10px] px-2 py-1 rounded">ALL</button>
                <script>
                    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
                    alphabet.forEach(letter => {
                        document.write(`<button class="bg-[#111] border border-brand-border text-gray-500 hover:text-brand-gold font-bold text-[10px] px-2 py-1 rounded transition">${letter}</button>`);
                    });
                </script>
            </div>
        </div>

        <div class="mb-6">
            <a href="teams.html" class="text-[10px] font-black uppercase text-gray-400 hover:text-white transition tracking-widest">← BACK TO TEAMS HUB</a>
        </div>

        <!-- 16-CARD GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- Card 1: Active Team -->
            <div class="bg-[#0a0a0a] border border-brand-gold rounded-xl p-4 flex flex-col group shadow-[0_0_15px_rgba(197,160,89,0.1)]">
                <div class="flex justify-between items-center mb-3">
                    <span class="bg-brand-red text-white text-[8px] font-black uppercase px-2 py-0.5 rounded">PRO PLUS LEAGUE</span>
                    <span class="text-brand-green font-black text-[8px] uppercase tracking-widest flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-brand-green"></span> RECRUITING</span>
                </div>
                
                <div class="h-32 bg-[#111] rounded-lg border border-brand-border flex flex-col items-center justify-center mb-4 group-hover:border-brand-gold transition cursor-pointer">
                    <h3 class="text-lg font-black uppercase text-white tracking-widest">STORM RIDERS</h3>
                    <span class="text-[8px] text-gray-600 font-bold uppercase tracking-widest mt-1">LOGO GRAPHIC</span>
                </div>
                
                <h3 class="text-sm font-black uppercase text-white tracking-wider">STORM RIDERS</h3>
                <span class="text-[9px] text-gray-500 uppercase mt-1 block tracking-wider">Leader: <span class="text-brand-red">Deathstalker Paine</span></span>
                
                <!-- Stats -->
                <div class="grid grid-cols-3 text-center mt-4 border-t border-brand-border pt-4">
                    <div>
                        <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">POINTS</span>
                        <span class="text-xs font-black text-brand-gold">12.5k</span>
                    </div>
                    <div>
                        <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">WINS</span>
                        <span class="text-xs font-black text-white">45</span>
                    </div>
                    <div>
                        <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">ROSTER</span>
                        <span class="text-xs font-black text-white">1/4</span>
                    </div>
                </div>

                <a href="team.html" class="mt-4 block w-full text-center bg-[#111] border border-brand-gold text-brand-gold hover:bg-brand-gold hover:text-black transition text-[9px] font-black uppercase py-2.5 rounded tracking-widest">VIEW TEAM PROFILE →</a>
            </div>

            <!-- Cards 2 through 16: Pending Teams -->
            <script>
                for(let i=0; i<15; i++) {
                    document.write(`
                    <div class="bg-[#0a0a0a] border border-brand-border rounded-xl p-4 flex flex-col opacity-60">
                        <div class="flex justify-between items-center mb-3">
                            <span class="bg-[#1a1a1a] text-gray-500 text-[8px] font-black uppercase px-2 py-0.5 rounded border border-brand-border">UNRANKED</span>
                            <span class="text-gray-600 font-black text-[8px] uppercase tracking-widest flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-gray-600"></span> CLOSED</span>
                        </div>
                        
                        <div class="h-32 bg-[#111] rounded-lg border border-brand-border flex items-center justify-center mb-4">
                            <span class="text-[8px] text-gray-700 font-bold uppercase tracking-widest text-center">REGISTRATION<br>PENDING</span>
                        </div>
                        
                        <h3 class="text-sm font-black uppercase text-gray-500 tracking-wider">PENDING SYNDICATE</h3>
                        <span class="text-[9px] text-gray-600 uppercase mt-1 block tracking-wider">Leader: TBD</span>
                        
                        <div class="grid grid-cols-3 text-center mt-4 border-t border-brand-border pt-4">
                            <div>
                                <span class="block text-[8px] text-gray-700 font-bold uppercase tracking-widest mb-1">POINTS</span>
                                <span class="text-xs font-black text-gray-600">0</span>
                            </div>
                            <div>
                                <span class="block text-[8px] text-gray-700 font-bold uppercase tracking-widest mb-1">WINS</span>
                                <span class="text-xs font-black text-gray-600">0</span>
                            </div>
                            <div>
                                <span class="block text-[8px] text-gray-700 font-bold uppercase tracking-widest mb-1">ROSTER</span>
                                <span class="text-xs font-black text-gray-600">0/4</span>
                            </div>
                        </div>

                        <button disabled class="mt-4 block w-full text-center bg-[#111] border border-brand-border text-gray-600 text-[9px] font-black uppercase py-2.5 rounded tracking-widest cursor-not-allowed">SLOT AVAILABLE</button>
                    </div>
                    `);
                }
            </script>
        </div>
    </main>
</body>
</html>
