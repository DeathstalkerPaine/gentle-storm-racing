<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profiles | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff', green: '#10B981' } } } } }
    </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-brand-card border-b border-brand-gold relative py-4 lg:py-10 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 relative flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="flex items-center justify-center lg:justify-start w-full lg:w-auto z-10">
                <a href="index.html"><img src="logo.png" alt="Logo" class="h-10 sm:h-16 lg:h-24 w-auto object-contain"></a>
            </div>
            <div class="w-full lg:absolute lg:inset-x-0 text-center pointer-events-none lg:px-40 py-1">
                <span class="block text-[10px] sm:text-xs font-black uppercase tracking-[0.3em] text-brand-gold mb-1">Syndicate Directory</span>
                <h1 class="text-2xl sm:text-3xl lg:text-5xl font-black uppercase tracking-wider text-white">Team Profiles</h1>
            </div>
        </div>
    </header>

    <nav class="bg-brand-bg border-b border-brand-border py-3">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-xs font-bold uppercase tracking-wider">
            <a href="index.html" class="text-gray-300 hover:text-brand-gold transition">GSR Main Menu</a>
            <a href="pro_plus.html" class="text-gray-300 hover:text-brand-gold transition">Pro Plus Hub</a>
            <a href="racetracks.html" class="text-gray-300 hover:text-brand-gold transition">Racetracks</a>
            <a href="teams.html" class="text-gray-300 hover:text-brand-gold transition">Teams Hub</a>
            <a href="teams_profiles.html" class="text-brand-gold transition underline decoration-2 underline-offset-4">Team Profile</a>
            <a href="leaderboard_view.html" class="text-gray-300 hover:text-brand-gold transition">Team Leaderboards</a>
            <a href="multimedia.html" class="text-gray-300 hover:text-brand-gold transition">Multi Media</a>
            <a href="chats.html" class="text-gray-300 hover:text-brand-gold transition">GSR Chats</a>
        </div>
    </nav>

    <main class="flex-grow max-w-[1400px] w-full mx-auto px-4 py-8">
        
        <div class="mb-6">
            <a href="teams.html" class="text-[10px] font-black uppercase text-gray-400 hover:text-white transition tracking-widest">← BACK TO TEAMS HUB</a>
        </div>

        <!-- DYNAMIC TEAM CARDS GRID -->
        <div id="teamDirectoryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <div class="col-span-full text-center text-xs text-gray-500 font-mono py-12">[ Querying live team directories... ]</div>
        </div>
    </main>

    <footer class="bg-brand-card border-t border-brand-border py-8 mt-12 text-center text-xs text-gray-500">
        &copy; 2026 Gentle Storm Racing. Built for Second Life.
    </footer>

    <!-- SUPABASE ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xwrfreokngnknftgzglg.supabase.co';
        const supabaseKey = 'sb_publishable_n7pgqjIuIeRORwzVZppaMA_3sowuxXw';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function loadTeamDirectory() {
            const grid = document.getElementById('teamDirectoryGrid');
            const { data: profiles } = await db.from('gsr_profiles').select('*');
            const allProfiles = profiles || [];

            const teamMap = {};
            allProfiles.forEach(p => {
                const tName = p.team_name || p.team || 'Unassigned';
                if (tName !== 'Unassigned' && tName.trim() !== '') {
                    if (!teamMap[tName]) teamMap[tName] = { name: tName, pts: 0, wins: 0, count: 0, leader: p.sl_legacy_name };
                    teamMap[tName].pts += (p.rating || 500);
                    teamMap[tName].wins += (p.wins || 0);
                    teamMap[tName].count += 1;
                }
            });

            const teams = Object.values(teamMap).sort((a,b) => b.pts - a.pts);

            if (teams.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-xs text-gray-500 font-mono py-12">[ No active syndicates found in database ]</div>`;
                return;
            }

            grid.innerHTML = '';
            teams.forEach(t => {
                grid.innerHTML += `
                    <div class="bg-[#0a0a0a] border border-brand-gold rounded-xl p-4 flex flex-col justify-between group shadow-[0_0_15px_rgba(197,160,89,0.1)]">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-brand-red text-white text-[8px] font-black uppercase px-2 py-0.5 rounded">PRO PLUS LEAGUE</span>
                                <span class="text-brand-green font-black text-[8px] uppercase tracking-widest flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-brand-green"></span> ACTIVE</span>
                            </div>
                            
                            <div class="h-32 bg-[#111] rounded-lg border border-brand-border flex flex-col items-center justify-center mb-4 group-hover:border-brand-gold transition cursor-pointer" onclick="window.location='team.html'">
                                <h3 class="text-lg font-black uppercase text-white tracking-widest text-center px-2">${escapeHtml(t.name)}</h3>
                            </div>
                            
                            <h3 class="text-sm font-black uppercase text-white tracking-wider">${escapeHtml(t.name)}</h3>
                            <span class="text-[9px] text-gray-500 uppercase mt-1 block tracking-wider">Leader: <span class="text-brand-red">${escapeHtml(t.leader || 'Leader')}</span></span>
                            
                            <div class="grid grid-cols-3 text-center mt-4 border-t border-brand-border pt-4">
                                <div>
                                    <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">POINTS</span>
                                    <span class="text-xs font-black text-brand-gold">${t.pts.toLocaleString()}</span>
                                </div>
                                <div>
                                    <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">WINS</span>
                                    <span class="text-xs font-black text-white">${t.wins}</span>
                                </div>
                                <div>
                                    <span class="block text-[8px] text-gray-600 font-bold uppercase tracking-widest mb-1">ROSTER</span>
                                    <span class="text-xs font-black text-white">${t.count}/4</span>
                                </div>
                            </div>
                        </div>

                        <a href="team.html" class="mt-4 block w-full text-center bg-[#111] border border-brand-gold text-brand-gold hover:bg-brand-gold hover:text-black transition text-[9px] font-black uppercase py-2.5 rounded tracking-widest">VIEW TEAM PROFILE →</a>
                    </div>
                `;
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        window.onload = loadTeamDirectory;
    </script>
</body>
</html>
