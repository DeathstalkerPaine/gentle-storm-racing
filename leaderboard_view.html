    <!-- SUPABASE ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://xwrfreokngnknftgzglg.supabase.co';
        const supabaseKey = 'sb_publishable_n7pgqjIuIeRORwzVZppaMA_3sowuxXw';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let liveProfiles = [];

        async function fetchLeaderboardData() {
            const { data, error } = await db.from('gsr_profiles').select('*');
            
            if (error) {
                console.warn("Supabase Access Blocked or Error:", error.message);
            }

            liveProfiles = data || [];

            // FALLBACK: If the database is empty or blocked by RLS, load ONLY your profile.
            if (liveProfiles.length === 0) {
                liveProfiles = [
                    { 
                        sl_legacy_name: "Deathstalker Paine", 
                        team: "Storm Riders", 
                        rating: 1250, 
                        wins: 45, 
                        losses: 12, 
                        draws: 1, 
                        dmg_dealt: 18500, 
                        dmg_taken: 9200, 
                        role: "pro_plus", 
                        best_lap: "0:38.210", 
                        best_course: "1:18.420" 
                    }
                ];
            }

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('leaderboardBody');
            const category = document.getElementById('queryCategory').value;
            const classVal = document.getElementById('queryClass').value;
            const trackVal = document.getElementById('queryTrack').value;
            const trackLabel = document.getElementById('trackLabel');
            
            if (!tbody) return;
            tbody.innerHTML = '';

            const trackNames = { 
                'all': 'Global (All Tracks)', 
                'vegas': 'Las Vegas Strip', 
                'future': 'Back to Future',
                'rome': 'Ancient Rome', 
                'city': 'Abandoned City' 
            };
            if (trackLabel) trackLabel.innerText = `Showing: ${trackNames[trackVal] || 'Global (All Tracks)'}`;

            // 1. TEAM AGGREGATE MODE
            if (category === 'team') {
                const teamStats = {};
                
                liveProfiles.forEach(p => {
                    const team = p.team_name || p.team || 'Unassigned';
                    if (team !== 'Unassigned' && team.trim() !== '') {
                        if (!teamStats[team]) {
                            teamStats[team] = { name: team, pts: 0, wins: 0, losses: 0, draws: 0, dmgOut: 0, dmgIn: 0 };
                        }
                        teamStats[team].pts += (p.rating || 500);
                        teamStats[team].wins += (p.wins || 0);
                        teamStats[team].losses += (p.losses || 0);
                        teamStats[team].draws += (p.draws || p.dsq || 0);
                        teamStats[team].dmgOut += (p.dmg_dealt || 0);
                        teamStats[team].dmgIn += (p.dmg_taken || 0);
                    }
                });

                const teams = Object.values(teamStats).sort((a,b) => b.pts - a.pts);

                if (teams.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="py-12 text-center text-gray-500 font-mono uppercase tracking-widest">[ NO SYNDICATE TELEMETRY FOUND FOR THIS QUERY ]</td></tr>`;
                    return;
                }

                teams.forEach((team, index) => {
                    const rankClass = index === 0 ? 'text-brand-gold text-lg text-shadow-glow' : 'text-gray-300 text-base';
                    const total = team.wins + team.losses + team.draws;
                    const winPct = total > 0 ? Math.round((team.wins / total) * 100) + '%' : '0%';

                    tbody.innerHTML += `
                        <tr class="hover:bg-white/5 transition">
                            <td class="py-4 px-6 text-center font-black italic ${rankClass}">${index + 1}</td>
                            <td class="py-4 px-4 cursor-pointer hover:bg-brand-card transition rounded" onclick="window.location='team.html'">
                                <div class="font-black text-white uppercase text-sm hover:text-brand-gold transition">${escapeHtml(team.name)}</div>
                                <div class="font-bold text-[9px] text-gray-500 uppercase">SYNDICATE</div>
                            </td>
                            <td class="py-4 px-4 text-center font-black text-brand-gold text-base bg-brand-gold/5">${team.pts.toLocaleString()}</td>
                            <td class="py-4 px-4 text-center font-black text-white">${winPct}</td>
                            <td class="py-4 px-4 text-center font-bold text-gray-400"><span class="text-white">${team.wins}</span> - ${team.losses} - ${team.draws}</td>
                            <td class="py-4 px-4 text-center font-mono font-bold text-brand-blue bg-brand-blue/5">--:--.---</td>
                            <td class="py-4 px-4 text-center font-mono font-bold text-brand-blue bg-brand-blue/5">--:--.---</td>
                            <td class="py-4 px-4 text-center font-mono font-bold text-brand-red">${team.dmgOut.toLocaleString()}</td>
                            <td class="py-4 px-4 text-center font-mono font-bold text-gray-500">${team.dmgIn.toLocaleString()}</td>
                        </tr>
                    `;
                });
                return;
            }

            // 2. INDIVIDUAL RACERS MODE
            let displayData = [...liveProfiles];

            if (classVal !== 'all') {
                displayData = displayData.filter(p => {
                    const roleStr = (p.role || p.league || '').toLowerCase().replace(' ', '_');
                    return roleStr.includes(classVal);
                });
            }

            if (displayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-12 text-center text-gray-500 font-mono uppercase tracking-widest">[ NO RACER TELEMETRY FOUND FOR THIS QUERY ]</td></tr>`;
                return;
            }

            displayData.sort((a,b) => (b.rating || 0) - (a.rating || 0));

            displayData.forEach((row, index) => {
                const name = row.sl_legacy_name || 'UNKNOWN';
                const team = row.team_name || row.team || 'UNASSIGNED';
                const rankClass = index === 0 ? 'text-brand-gold text-lg text-shadow-glow' : (index === 1 ? 'text-gray-300 text-base' : 'text-gray-500 text-sm');
                
                const wins = row.wins || 0;
                const losses = row.losses || 0;
                const draws = row.draws || row.dsq || 0;
                const totalRaces = wins + losses + draws;
                const winPct = totalRaces > 0 ? Math.round((wins / totalRaces) * 100) + '%' : '0%';
                
                const bestLap = row.best_lap || "--:--.---";
                const bestCourse = row.best_course || "--:--.---";

                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition">
                        <td class="py-4 px-6 text-center font-black italic ${rankClass}">${index + 1}</td>
                        <td class="py-4 px-4 cursor-pointer hover:bg-brand-card transition rounded" onclick="window.location='racer.html?driver=${encodeURIComponent(name)}'">
                            <div class="font-black text-white uppercase text-sm hover:text-brand-gold transition">${escapeHtml(name)}</div>
                            <div class="font-bold text-[9px] text-gray-500 uppercase">${escapeHtml(team)}</div>
                        </td>
                        <td class="py-4 px-4 text-center font-black text-brand-gold text-base bg-brand-gold/5">${(row.rating || 500).toLocaleString()}</td>
                        <td class="py-4 px-4 text-center font-black text-white">${winPct}</td>
                        <td class="py-4 px-4 text-center font-bold text-gray-400"><span class="text-white">${wins}</span> - ${losses} - <span class="text-gray-500">${draws}</span></td>
                        <td class="py-4 px-4 text-center font-mono font-bold text-brand-blue bg-brand-blue/5">${bestLap}</td>
                        <td class="py-4 px-4 text-center font-mono font-bold text-brand-blue bg-brand-blue/5">${bestCourse}</td>
                        <td class="py-4 px-4 text-center font-mono font-bold text-brand-red">${(row.dmg_dealt || 0).toLocaleString()}</td>
                        <td class="py-4 px-4 text-center font-mono font-bold text-gray-500">${(row.dmg_taken || 0).toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        function initFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('category')) {
                const el = document.getElementById('queryCategory');
                if (el) el.value = urlParams.get('category');
            }
            if (urlParams.has('class')) {
                const el = document.getElementById('queryClass');
                if (el) el.value = urlParams.get('class');
            }
            if (urlParams.has('time')) {
                const el = document.getElementById('queryTime');
                if (el) el.value = urlParams.get('time');
            }
            if (urlParams.has('track')) {
                const el = document.getElementById('queryTrack');
                if (el) el.value = urlParams.get('track');
            }

            fetchLeaderboardData();
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        window.onload = initFromURL;
    </script>
