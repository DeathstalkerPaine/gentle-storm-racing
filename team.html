    <!-- SUPABASE ENGINE (MATCHED TO ACTUAL DB SCHEMA) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pageTeamName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "Storm Riders";
        
        document.getElementById('pageTeamTitleHeader').innerText = pageTeamName;
        document.getElementById('cardTeamTitle').innerText = pageTeamName;

        const supabaseUrl = 'https://xwrfreokngnknftgzglg.supabase.co';
        const supabaseKey = 'sb_publishable_n7pgqjIuIeRORwzVZppaMA_3sowuxXw';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let displayName = "";
        let isVerifiedTeamMember = false;
        let isTeamLeader = false;
        let teamIsRecruiting = true; // Default ON
        let currentTeamId = null;

        // --- 1. PULL ROSTER USING TEAM_MEMBERS & RACERS ---
        async function renderTeamRoster() {
            const grid = document.getElementById('teamRosterGrid');
            const leaderDisplay = document.getElementById('teamLeaderDisplay');

            // Find the team ID from the teams table
            const { data: teamData } = await db.from('teams').select('id').eq('name', pageTeamName).single();
            
            if (!teamData) {
                grid.innerHTML = `<div class="col-span-full text-center text-xs text-gray-500 font-mono py-4">[ Team not found in database ]</div>`;
                return;
            }
            
            currentTeamId = teamData.id;

            // Pull the roster by joining team_members with racers
            const { data: drivers, error } = await db
                .from('team_members')
                .select('role, racers(display_name, racer_number)')
                .eq('team_id', currentTeamId)
                .eq('is_active', true);

            if (error || !drivers || drivers.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-xs text-gray-500 font-mono py-4">[ No drivers assigned to this team yet ]</div>`;
                if (leaderDisplay) leaderDisplay.innerText = "UNASSIGNED";
                return;
            }

            grid.innerHTML = '';
            let foundLeaderName = "UNASSIGNED";

            drivers.forEach(driver => {
                const driverName = driver.racers?.display_name || 'UNKNOWN DRIVER';
                const driverNum = driver.racers?.racer_number ? `#${driver.racers.racer_number}` : '#--';
                const role = driver.role || 'PRO LEAGUE';
                
                if (role.toLowerCase() === 'leader') {
                    foundLeaderName = driverName;
                }

                const profileUrl = `racer.html?driver=${encodeURIComponent(driverName)}`;

                grid.innerHTML += `
                    <div class="bg-[#0a0a0a] border border-brand-border hover:border-brand-blue rounded-xl p-3 flex flex-col justify-between group transition shadow-md">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="bg-brand-red text-white text-[7px] font-black uppercase px-1.5 py-0.5 rounded tracking-wider">${role}</span>
                                <span class="text-brand-blue font-mono font-black text-[10px]">${driverNum}</span>
                            </div>
                            <div class="aspect-square bg-[#111] rounded-lg border border-brand-border flex items-center justify-center mb-2 group-hover:border-brand-blue transition cursor-pointer" onclick="window.location='${profileUrl}'">
                                <span class="text-[8px] text-gray-600 font-bold uppercase tracking-widest text-center">PHOTO</span>
                            </div>
                            <h4 class="text-[11px] font-black uppercase text-white tracking-wider truncate">${escapeHtml(driverName)}</h4>
                        </div>
                        <a href="${profileUrl}" class="mt-3 block w-full text-center bg-[#111] border border-brand-border text-gray-300 hover:border-brand-blue hover:text-white transition text-[8px] font-black uppercase py-1.5 rounded tracking-wider">VIEW PROFILE →</a>
                    </div>
                `;
            });

            if (leaderDisplay) {
                leaderDisplay.innerHTML = foundLeaderName !== "UNASSIGNED" 
                    ? `<a href="racer.html?driver=${encodeURIComponent(foundLeaderName)}" class="hover:text-brand-gold transition underline uppercase">${escapeHtml(foundLeaderName)}</a>`
                    : "UNASSIGNED";
            }
        }

        // --- 2. AUTHENTICATION (EXACT MATCH TO INDEX.HTML) ---
        async function initTeamCardPage() {
            await renderTeamRoster(); // Load roster and team ID first

            const { data: { session } } = await db.auth.getSession();
            if (session && session.user) {
                await handleAuthUser(session.user);
            }

            db.auth.onAuthStateChange(async (event, session) => {
                if (session && session.user) {
                    await handleAuthUser(session.user);
                } else {
                    currentUser = null;
                    isVerifiedTeamMember = false;
                    isTeamLeader = false;
                    updateHeaderAuthUI();
                    renderBannerControls();
                }
            });
        }

        async function handleAuthUser(user) {
            currentUser = user;
            
            // From your index.html - checking gsr_profiles
            const { data: profile } = await db
                .from('gsr_profiles')
                .select('sl_legacy_name')
                .eq('id', currentUser.id)
                .single();

            displayName = profile?.sl_legacy_name || currentUser.email.split('@')[0];
            
            // Check if this user is explicitly in the team_members table for this team
            if (currentTeamId) {
                const { data: memberRecord } = await db
                    .from('team_members')
                    .select('role')
                    .eq('team_id', currentTeamId)
                    .eq('racer_id', currentUser.id)
                    .single();

                if (memberRecord) {
                    isVerifiedTeamMember = true;
                    if (memberRecord.role.toLowerCase() === 'leader') {
                        isTeamLeader = true;
                    }
                }
            }

            updateHeaderAuthUI();
            renderBannerControls();
        }

        function updateHeaderAuthUI() {
            const userNav = document.getElementById('userNav');
            if (!userNav) return;

            if (currentUser) {
                userNav.innerHTML = `
                    <div class="text-right hidden sm:block">
                        <span class="block text-xs font-black text-white uppercase">${escapeHtml(displayName)}</span>
                        <span class="text-[9px] text-brand-green uppercase font-mono tracking-widest flex items-center justify-end gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-brand-green animate-pulse"></span> Logged In
                        </span>
                    </div>
                    <button onclick="executeSignOut()" class="bg-brand-bg border border-brand-border hover:border-brand-red text-white text-[9px] sm:text-xs uppercase font-black px-3 py-1.5 lg:px-4 lg:py-2 rounded transition sm:ml-4 shadow cursor-pointer">Sign Out</button>
                `;
            } else {
                userNav.innerHTML = `
                    <a href="sign_in.html" class="bg-brand-bg border border-brand-border hover:border-brand-gold text-gray-300 hover:text-white font-black uppercase text-[9px] sm:text-xs px-3 py-1.5 lg:px-4 lg:py-2 rounded transition">Sign In</a>
                    <a href="sign_up.html" class="bg-brand-red hover:bg-red-700 text-white font-black uppercase text-[9px] sm:text-xs px-3 py-1.5 lg:px-4 lg:py-2 rounded transition shadow-lg">Sign Up</a>
                `;
            }
        }

        // --- 3. RECRUITMENT UI LOGIC ---
        function renderBannerControls() {
            const container = document.getElementById('bannerApplyContainer');
            const badge = document.getElementById('recruitmentBadge');
            if (!container || !badge) return;

            if (isTeamLeader) {
                badge.className = teamIsRecruiting 
                    ? "bg-green-500 text-black border border-green-300 font-black uppercase text-[10px] px-3 py-1.5 rounded shadow-lg animate-pulse transition cursor-pointer hover:bg-green-400"
                    : "bg-red-600 text-white border border-red-400 font-black uppercase text-[10px] px-3 py-1.5 rounded shadow-lg transition cursor-pointer hover:bg-red-500";
                badge.innerText = teamIsRecruiting ? "● Recruiting Drivers (Click to Toggle)" : "✖ Roster Closed (Click to Open)";
            } else {
                badge.className = teamIsRecruiting 
                    ? "bg-green-500 text-black border border-green-300 font-black uppercase text-[10px] px-3 py-1.5 rounded shadow-lg animate-pulse transition cursor-default"
                    : "bg-gray-700 text-gray-300 border border-gray-500 font-black uppercase text-[10px] px-3 py-1.5 rounded shadow-lg transition cursor-default";
                badge.innerText = teamIsRecruiting ? "● Recruiting Drivers" : "✖ Roster Closed";
            }

            let html = '';

            if (teamIsRecruiting) {
                if (isTeamLeader) {
                    html += `<a href="recruitment.html?team=${encodeURIComponent(pageTeamName)}" class="bg-brand-blue hover:bg-blue-600 text-white font-black uppercase text-[9px] px-3 py-1.5 rounded shadow transition flex items-center gap-1.5 border border-brand-blue cursor-pointer">
                        📋 Review Applications
                    </a>`;
                } else if (currentUser && !isVerifiedTeamMember) {
                    html += `<button onclick="openApplicationModal()" class="bg-green-600 hover:bg-green-500 text-black font-black uppercase text-[9px] px-3 py-1.5 rounded shadow transition flex items-center gap-1.5 cursor-pointer">
                        📝 Apply for Roster
                    </button>`;
                }
            }

            container.innerHTML = html;
        }

        function toggleRecruitmentStatus() {
            if (!isTeamLeader) return;
            teamIsRecruiting = !teamIsRecruiting;
            renderBannerControls();
        }

        function openApplicationModal() {
            document.getElementById('applicantName').innerText = displayName;
            document.getElementById('applicationModal').classList.remove('hidden');
            document.getElementById('applicationModal').classList.add('flex');
        }

        async function submitApplication() {
            if (!currentUser) return;
            
            const { error } = await db.from('gsr_applications').insert([{
                user_id: currentUser.id,
                applicant_name: displayName,
                team_name: pageTeamName
            }]);

            if (error) {
                alert("Application error: " + error.message);
            } else {
                alert("Your roster application has been successfully transmitted to the Team Leader!");
            }
            closeModals();
        }

        function closeModals() {
            document.getElementById('applicationModal').classList.add('hidden');
            document.getElementById('applicationModal').classList.remove('flex');
        }

        async function executeSignOut() {
            await db.auth.signOut();
            window.location.reload(); 
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

        window.onload = initTeamCardPage;
    </script>
