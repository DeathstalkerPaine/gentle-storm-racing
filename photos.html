<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff' } } } } }
    </script>
    <style>
        .blue-border-glow { border: 1px solid #2a75ff; box-shadow: 0 0 20px rgba(42, 117, 255, 0.25); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-brand-card border-b border-brand-blue relative py-4 lg:py-8 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 relative flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center justify-center md:justify-start w-full md:w-auto z-10">
                <a href="index.html" class="inline-block">
                    <img src="logo.png" alt="GSR Logo" class="h-10 sm:h-14 w-auto object-contain hover:scale-105 transition-transform">
                </a>
            </div>

            <div class="w-full md:absolute md:inset-x-0 text-center pointer-events-none md:px-40 py-1">
                <span class="block text-[9px] font-black uppercase tracking-[0.3em] text-brand-blue">Track, Race & Custom Captures</span>
                <h1 class="text-xl sm:text-2xl font-black uppercase text-white tracking-wider">PHOTO GALLERY</h1>
            </div>

            <div class="flex items-center gap-3 z-10 w-full md:w-auto justify-center" id="headerControls">
                <label for="monthSelect" class="text-[9px] font-bold uppercase text-gray-400 tracking-widest whitespace-nowrap hidden sm:inline">Month:</label>
                <select id="monthSelect" onchange="filterByMonth(this.value)" class="bg-brand-bg border border-brand-blue text-white font-black uppercase text-[10px] px-3 py-2 rounded outline-none cursor-pointer">
                    <option value="all">All Months</option>
                    <option value="oct_2026" selected>October 2026</option>
                    <option value="sep_2026">September 2026</option>
                </select>
                <div id="userNav" class="flex items-center gap-2"></div>
                <a href="multimedia.html" class="bg-brand-bg border border-brand-border hover:border-brand-blue text-white font-bold uppercase text-[10px] px-3 py-2 rounded transition whitespace-nowrap">
                    Hub →
                </a>
            </div>

        </div>
        <div id="userNavMobile" class="flex sm:hidden flex-col items-center justify-center gap-2 mt-3 px-4 z-10 w-full"></div>
    </header>

    <!-- SUB-NAVBAR -->
    <nav class="bg-brand-bg border-b border-brand-border py-2.5">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-6 text-xs font-bold uppercase tracking-wider">
            <a href="multimedia.html" class="text-gray-300 hover:text-brand-blue transition">Media Hub</a>
            <a href="magazine.html" class="text-gray-300 hover:text-gray-300 transition">GSRacing Magazine</a>
            <a href="news.html" class="text-gray-300 hover:text-gray-300 transition">GSR News</a>
            <a href="videos.html" class="text-gray-300 hover:text-gray-300 transition">Video Archives</a>
            <a href="photos.html" class="text-brand-blue transition underline decoration-2 underline-offset-4">Photo Gallery</a>
            <a href="events.html" class="text-gray-300 hover:text-brand-blue transition">Live Events</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
        
        <!-- GALLERY SECTION WITH INTERACTIVE FILTER BUTTONS -->
        <section class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b border-brand-border pb-3 gap-3">
                <div>
                    <h2 class="text-lg font-black uppercase text-white">Visual Archives</h2>
                    <p class="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Click category tabs below to sort captures instantly</p>
                </div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <!-- Category Filter Buttons -->
                    <div id="filterButtons" class="flex flex-wrap gap-2 text-[10px] font-black uppercase">
                        <button onclick="filterCategory('all', this)" class="filter-btn bg-brand-blue text-white px-3 py-1.5 rounded transition shadow">All Captures</button>
                        <button onclick="filterCategory('track', this)" class="filter-btn bg-brand-card border border-brand-border hover:border-brand-blue text-gray-300 px-3 py-1.5 rounded transition">Track Photos</button>
                        <button onclick="filterCategory('race', this)" class="filter-btn bg-brand-card border border-brand-border hover:border-brand-blue text-gray-300 px-3 py-1.5 rounded transition">Race Photos</button>
                        <button onclick="filterCategory('featured', this)" class="filter-btn bg-brand-card border border-brand-border hover:border-brand-blue text-gray-300 px-3 py-1.5 rounded transition">Featured / Other</button>
                    </div>

                    <!-- Admin Add Photo Trigger -->
                    <button id="addPhotoBtn" onclick="openPhotoModal(null)" class="hidden bg-brand-blue border border-brand-border hover:bg-blue-600 text-white font-black uppercase text-[10px] px-3 py-1.5 rounded transition shadow cursor-pointer ml-2">
                        + Add Photo
                    </button>
                </div>
            </div>

            <!-- DYNAMIC PHOTO GRID INJECTED VIA JAVASCRIPT -->
            <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 items-start">
                <div class="col-span-full py-16 text-center text-xs text-gray-500 font-mono">[ Querying photo database... ]</div>
            </div>
        </section>

    </main>

    <!-- UNIVERSAL FOOTER -->
    <footer class="bg-brand-card border-t border-brand-border py-8 mt-12 text-center text-xs text-gray-500">
        &copy; 2026 Gentle Storm Racing. Built for Second Life.
    </footer>

    <!-- FULLSCREEN LIGHTBOX MODAL -->
    <div id="lightboxOverlay" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[120] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-5xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white hover:text-brand-red text-xs font-black uppercase px-2 py-1 cursor-pointer">✕ Close</button>
            <img id="lightboxImg" src="" class="max-h-[80vh] w-auto rounded-lg border border-brand-border shadow-2xl object-contain">
            <div class="mt-3 text-center">
                <span id="lightboxCategory" class="text-[9px] font-black uppercase text-brand-blue tracking-widest block"></span>
                <h3 id="lightboxTitle" class="text-sm font-black uppercase text-white mt-0.5"></h3>
                <span id="lightboxCredit" class="text-[10px] text-gray-400 font-mono"></span>
            </div>
        </div>
    </div>

    <!-- ADMIN ADD / EDIT PHOTO MODAL -->
    <div id="cmsModalOverlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="cmsModal" class="bg-brand-card border border-brand-blue shadow-[0_0_30px_rgba(42,117,255,0.2)] rounded-xl w-full max-w-md transform scale-95 opacity-0 transition-all duration-300 flex flex-col max-h-[90vh]">
            <div class="bg-brand-bg border-b border-brand-border p-4 flex justify-between items-center rounded-t-xl shrink-0">
                <h2 id="cmsModalTitle" class="text-sm font-black uppercase text-brand-blue tracking-wide">📸 Manage Photo</h2>
                <button onclick="closeCMSModal()" class="text-gray-500 hover:text-brand-red p-1 transition cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-6 space-y-4 overflow-y-auto grow">
                <input type="hidden" id="edit_id">

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-gray-400">Photo Title</label>
                    <input type="text" id="edit_title" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-xs px-3 py-2 rounded">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-400">Category</label>
                        <select id="edit_category" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-xs px-3 py-2 rounded">
                            <option value="track">Track Photo</option>
                            <option value="race">Race Photo</option>
                            <option value="featured">Featured / Other</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-400">Month Key</label>
                        <input type="text" id="edit_month" placeholder="oct_2026" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-xs px-3 py-2 rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-400">Aspect Ratio</label>
                        <select id="edit_aspect" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-xs px-3 py-2 rounded">
                            <option value="aspect-video">16:9 (Widescreen)</option>
                            <option value="aspect-square">1:1 (Square)</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-400">Photographer / Credit</label>
                        <input type="text" id="edit_credit" placeholder="e.g. Deathstalker Paine" class="w-full bg-[#0a0a0a] border border-brand-border text-white text-xs px-3 py-2 rounded">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-gray-400">Image File / Direct URL</label>
                    <input type="text" id="edit_imgUrl" placeholder="Paste URL or upload below..." class="w-full bg-[#0a0a0a] border border-brand-border text-white text-[10px] px-3 py-1.5 rounded mb-1">
                    <input type="file" id="upload_imgFile" accept="image/*" class="w-full text-[9px] text-gray-400" onchange="uploadPhotoFile(this)">
                </div>
            </div>

            <div class="bg-brand-bg border-t border-brand-border p-4 flex justify-between gap-3 rounded-b-xl shrink-0">
                <button id="deletePhotoBtn" onclick="deletePhotoItem()" class="hidden bg-red-950/60 hover:bg-red-900 text-brand-red border border-red-500/40 text-xs font-black uppercase px-4 py-2 rounded transition cursor-pointer">
                    Delete
                </button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="closeCMSModal()" class="text-xs font-bold uppercase text-gray-400 hover:text-white px-4 py-2 transition cursor-pointer">Cancel</button>
                    <button onclick="savePhotoItem()" class="bg-brand-blue hover:bg-blue-600 text-white font-black uppercase text-xs px-6 py-2 rounded transition shadow cursor-pointer">Save Photo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CENTRAL SHARED ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="gsr-core.js"></script>

    <script>
        let isEditModeActive = false;
        let allPhotos = [];
        let activeCategory = 'all';
        let activeMonth = 'all';

        async function initPhotosPage() {
            try { 
                await initGlobalAuth(handleAdminPhotosSync); 
            } catch (e) {}

            await fetchPhotos();
        }

        function handleAdminPhotosSync() {
            if (window.currentProfile?.is_admin) {
                const controls = document.getElementById('headerControls');
                if (!document.getElementById('editModeBtn')) {
                    controls.innerHTML += `<button id="editModeBtn" onclick="toggleEditMode()" class="bg-brand-blue border border-brand-border hover:bg-blue-600 text-white font-black uppercase text-[10px] px-3 py-2 rounded transition whitespace-nowrap shadow ml-2 cursor-pointer">✏️ Edit Mode</button>`;
                }
            }
        }

        window.onAuthChangeCallback = function() {
            handleAdminPhotosSync();
        };

        async function fetchPhotos() {
            const { data, error } = await window.db.from('gsr_photos').select('*').order('created_at', { ascending: false });
            if (!error && data) {
                allPhotos = data;
            } else {
                allPhotos = [];
            }
            renderGallery();
        }

        function renderGallery() {
            const gridEl = document.getElementById('photoGrid');
            gridEl.innerHTML = '';

            const filtered = allPhotos.filter(item => {
                const matchCategory = activeCategory === 'all' || item.category === activeCategory;
                const matchMonth = activeMonth === 'all' || item.month_key === activeMonth;
                return matchCategory && matchMonth;
            });

            if (filtered.length === 0) {
                gridEl.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-gray-500 font-mono uppercase">[ No photos found for this selection ]</div>`;
                return;
            }

            filtered.forEach(photo => {
                const card = document.createElement('div');
                const aspectClass = photo.aspect_ratio || 'aspect-video';
                card.className = `${aspectClass} bg-brand-card border border-brand-border hover:border-brand-blue rounded-xl overflow-hidden shadow-lg transition group relative cursor-pointer flex items-center justify-center`;

                let editButtonsHTML = '';
                if (isEditModeActive) {
                    editButtonsHTML = `
                        <div class="absolute top-2 left-2 z-30 flex gap-1">
                            <button onclick="openPhotoModal('${photo.id}'); event.stopPropagation();" class="bg-brand-blue text-white text-[9px] font-black uppercase px-2 py-1 rounded shadow cursor-pointer">✏️ Edit</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${editButtonsHTML}
                    <img src="${photo.image_url}" alt="${escapeHtml(photo.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onclick="openLightbox('${photo.id}')">
                    <div class="absolute inset-0 bg-black/75 opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-4 pointer-events-none">
                        <span class="text-[9px] font-black uppercase text-brand-blue tracking-widest">${photo.category.toUpperCase()} PHOTO</span>
                        <span class="text-white text-xs font-black uppercase tracking-wider mt-0.5">${escapeHtml(photo.title)}</span>
                        ${photo.credit ? `<span class="text-[9px] text-gray-400 font-mono mt-0.5">By: ${escapeHtml(photo.credit)}</span>` : ''}
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        function filterCategory(category, btnElement) {
            activeCategory = category;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-brand-card border border-brand-border hover:border-brand-blue text-gray-300 px-3 py-1.5 rounded transition";
            });
            btnElement.className = "filter-btn bg-brand-blue text-white px-3 py-1.5 rounded transition shadow font-black";

            renderGallery();
        }

        function filterByMonth(month) {
            activeMonth = month;
            renderGallery();
        }

        window.openLightbox = function(id) {
            const photo = allPhotos.find(p => p.id === id);
            if (!photo) return;

            document.getElementById('lightboxImg').src = photo.image_url;
            document.getElementById('lightboxCategory').innerText = `${photo.category.toUpperCase()} CAPTURE`;
            document.getElementById('lightboxTitle').innerText = photo.title;
            document.getElementById('lightboxCredit').innerText = photo.credit ? `Captured by: ${photo.credit}` : '';

            const overlay = document.getElementById('lightboxOverlay');
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.remove('opacity-0'); }, 10);
        }

        window.closeLightbox = function() {
            const overlay = document.getElementById('lightboxOverlay');
            overlay.classList.add('opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); }, 300);
        }

        window.toggleEditMode = function() {
            isEditModeActive = !isEditModeActive;
            const btn = document.getElementById('editModeBtn');
            if (btn) {
                btn.innerHTML = isEditModeActive ? '❌ Disable Edit Mode' : '✏️ Edit Mode';
                btn.classList.toggle('bg-brand-blue', !isEditModeActive);
                btn.classList.toggle('bg-brand-red', isEditModeActive);
            }

            document.getElementById('addPhotoBtn').classList.toggle('hidden', !isEditModeActive);
            renderGallery();
        }

        window.openPhotoModal = function(id) {
            const delBtn = document.getElementById('deletePhotoBtn');
            const modalTitle = document.getElementById('cmsModalTitle');

            if (id) {
                const photo = allPhotos.find(item => item.id === id);
                if (photo) {
                    document.getElementById('edit_id').value = photo.id;
                    document.getElementById('edit_title').value = photo.title;
                    document.getElementById('edit_category').value = photo.category;
                    document.getElementById('edit_month').value = photo.month_key;
                    document.getElementById('edit_aspect').value = photo.aspect_ratio || 'aspect-video';
                    document.getElementById('edit_credit').value = photo.credit || '';
                    document.getElementById('edit_imgUrl').value = photo.image_url;

                    delBtn.classList.remove('hidden');
                    modalTitle.innerText = "📸 Edit Photo Details";
                }
            } else {
                document.getElementById('edit_id').value = `photo_${Date.now()}`;
                document.getElementById('edit_title').value = '';
                document.getElementById('edit_category').value = 'track';
                document.getElementById('edit_month').value = 'oct_2026';
                document.getElementById('edit_aspect').value = 'aspect-video';
                document.getElementById('edit_credit').value = '';
                document.getElementById('edit_imgUrl').value = '';

                delBtn.classList.add('hidden');
                modalTitle.innerText = "📸 Add New Gallery Photo";
            }

            const overlay = document.getElementById('cmsModalOverlay');
            const modal = document.getElementById('cmsModal');
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.remove('opacity-0'); modal.classList.remove('scale-95', 'opacity-0'); }, 10);
        }

        window.uploadPhotoFile = async function(inputEl) {
            if (!inputEl.files || inputEl.files.length === 0) return;
            const file = inputEl.files[0];
            const fileName = `gallery_photo_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

            const { error } = await window.db.storage.from('admin-assets').upload(fileName, file);
            if (!error) {
                const { data } = window.db.storage.from('admin-assets').getPublicUrl(fileName);
                document.getElementById('edit_imgUrl').value = data.publicUrl;
            } else {
                alert("Photo upload failed.");
            }
        }

        window.savePhotoItem = async function() {
            const id = document.getElementById('edit_id').value.trim();
            const title = document.getElementById('edit_title').value.trim();
            const category = document.getElementById('edit_category').value;
            const month_key = document.getElementById('edit_month').value.trim() || 'oct_2026';
            const aspect_ratio = document.getElementById('edit_aspect').value;
            const credit = document.getElementById('edit_credit').value.trim();
            const image_url = document.getElementById('edit_imgUrl').value.trim();

            if (!title || !image_url) {
                alert("Title and Image URL are required.");
                return;
            }

            const { error } = await window.db.from('gsr_photos').upsert({
                id,
                title,
                category,
                month_key,
                aspect_ratio,
                credit,
                image_url
            });

            if (!error) {
                await fetchPhotos();
                closeCMSModal();
            } else {
                alert("Database Error saving photo.");
            }
        }

        window.deletePhotoItem = async function() {
            const id = document.getElementById('edit_id').value;
            if (!id) return;

            if (confirm("Permanently delete this photo from the gallery?")) {
                const { error } = await window.db.from('gsr_photos').delete().eq('id', id);
                if (!error) {
                    await fetchPhotos();
                    closeCMSModal();
                } else {
                    alert("Error deleting photo from database.");
                }
            }
        }

        window.closeCMSModal = function() {
            const overlay = document.getElementById('cmsModalOverlay');
            const modal = document.getElementById('cmsModal');
            overlay.classList.add('opacity-0');
            modal.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); }, 300);
        }

        window.onload = initPhotosPage;
    </script>
</body>
</html>
