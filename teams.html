<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gentle Storm Racing - Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ff2a2a',
              dark: '#0e1117',
              card: '#161b22',
              border: '#30363d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen font-sans">

  <!-- Header Navigation -->
  <header class="border-b border-brand-border bg-brand-card py-4 px-8 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-8 bg-brand-red rounded-sm"></div>
      <h1 class="text-2xl font-black tracking-wider uppercase text-white">Gentle Storm <span class="text-brand-red">Racing</span></h1>
    </div>
    <nav class="flex space-x-6 text-sm font-semibold text-gray-400">
      <a href="index.html" class="hover:text-white transition">Main Menu</a>
      <a href="leaderboards.html" class="hover:text-white transition">Leaderboards</a>
      <a href="#" class="hover:text-white transition">Tracks</a>
      <a href="racers.html" class="hover:text-white transition">Racers</a>
      <a href="teams.html" class="text-white border-b-2 border-brand-red pb-1">Teams</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto py-10 px-4">
    
    <div class="flex justify-between items-end mb-8 border-b border-brand-border pb-4">
      <div>
        <h2 class="text-3xl font-bold uppercase tracking-tight text-white">Active Teams</h2>
        <p class="text-gray-400 mt-1">Official racing syndicates and league rosters.</p>
      </div>
    </div>

    <!-- Teams Directory Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      
      <!-- Clickable Storm Riders Card -->
      <a href="team.html" class="block bg-brand-card border border-brand-border hover:border-brand-red rounded-xl overflow-hidden shadow-2xl transition duration-200 transform hover:-translate-y-1 group">
        
        <!-- Background Banner Preview -->
        <div class="h-28 bg-cover bg-center relative border-b border-brand-border bg-gradient-to-r from-red-950 to-brand-dark" style="background-image: url('stormriders-banner.jpg');">
          <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <div class="p-6 relative">
          <!-- Team Logo Box -->
          <div class="flex justify-between items-end -mt-16 mb-4">
            <div class="w-20 h-20 rounded-lg border-4 border-brand-card bg-gray-900 flex items-center justify-center overflow-hidden shadow-lg z-10">
              <span class="text-xs text-gray-500 uppercase text-center font-bold">Logo</span>
            </div>
            <span class="bg-brand-red text-white text-xs font-bold px-3 py-1 rounded uppercase shadow">Pro League</span>
          </div>

          <h3 class="text-3xl font-black tracking-wider text-white group-hover:text-brand-red transition">Storm Riders</h3>
          <p class="text-gray-400 text-sm mb-4">Founded by Deathstalker Paine. Seeking dominance on the track.</p>

          <div class="border-t border-brand-border pt-4 flex justify-between items-center text-sm">
            <span class="text-gray-400">Leader: <strong class="text-white">Deathstalker Paine</strong></span>
            <span class="text-brand-red font-bold">View Team Profile &rarr;</span>
          </div>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
