<!-- GSR CHATS THREADS (LIVE CONNECTED WIDGET WITH DROPDOWN) -->
<div class="bg-brand-card border border-brand-border rounded-xl p-6 transition flex flex-col justify-between group">
    <div>
        <div class="flex justify-between items-center gap-2">
            <span class="text-[10px] font-black uppercase text-brand-gold tracking-wider">Live Discussion</span>
            
            <div class="flex items-center gap-2">
                <!-- Channel Selector Dropdown -->
                <select id="indexChatSelect" onchange="switchIndexChannel(this.value)" class="bg-[#0a0a0a] border border-brand-border text-brand-gold text-[10px] font-black uppercase px-2 py-1 rounded outline-none focus:border-brand-gold cursor-pointer">
                    <option value="global" selected>🌐 Global</option>
                    <option value="following">👥 Following</option>
                    <option value="team">🛡️ Team Chat</option>
                    <option value="pro_plus">⭐ Pro Plus</option>
                </select>
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse shrink-0"></span>
            </div>
        </div>
        
        <h3 class="text-lg font-black uppercase text-white mt-2">GSR Chats Threads</h3>
        
        <!-- Dynamic Read-Only Feed Box -->
        <div id="mainMenuChatFeed" class="bg-brand-bg border border-brand-border rounded-lg p-3 my-3 space-y-2 h-28 overflow-hidden flex flex-col justify-end">
            <div class="text-[10px] text-gray-500 text-center block my-auto">[ Connecting to frequency... ]</div>
        </div>
    </div>
    
    <div class="pt-3 border-t border-brand-border flex justify-between items-center text-xs">
        <span id="indexChannelLabel" class="text-[9px] text-gray-500 font-mono uppercase">Active: 🌐 Global</span>
        <a href="chats.html" class="font-bold uppercase text-brand-gold hover:underline">Open Comms Hub →</a>
    </div>
</div>
