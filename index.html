<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gentle Storm Racing</title>
  <style>
    /* Dark background so white and gold text stay readable */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Top-left container holding logo and stacked navigation */
    .header-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px;
      gap: 20px; /* Space between logo and menu links */
    }

    /* Scaled-up logo styling */
    .header-logo {
      width: 340px; /* Adjust this number to make the logo larger or smaller */
      height: auto;
      display: block;
    }

    /* Table of contents vertical layout */
    .table-of-contents ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px; /* Spacing between each menu item */
    }

    .table-of-contents a {
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      transition: color 0.2s ease-in-out;
    }

    /* Gold accent color when hovering over links */
    .table-of-contents a:hover {
      color: #c5a059;
    }
  </style>
</head>
<body>

  <header class="header-container">
    <!-- Top-left logo -->
    <a href="index.html">
      <!-- MAKE SURE 'logo.png' MATCHES YOUR EXACT IMAGE FILENAME -->
      <img src="logo.png" alt="Gentle Storm Racing" class="header-logo">
    </a>

    <!-- Table of Contents stacked directly under logo -->
    <nav class="table-of-contents">
      <ul>
        <li><a href="#main-menu">Main Menu</a></li>
        <li><a href="#leaderboards">Leaderboards</a></li>
        <li><a href="#tracks">Tracks</a></li>
        <li><a href="#racers">Racers</a></li>
        <li><a href="#teams">Teams</a></li>
      </ul>
    </nav>
  </header>

</body>
</html>
