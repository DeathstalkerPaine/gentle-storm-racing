<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racer Profiles | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff', green: '#10B981' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a059; }
    </style>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-brand-card border-b border-brand-gold relative py-4 lg:py-10 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 relative flex flex-col lg:flex-row items-center justify-between gap-4">
            <div class="flex items-center justify-center lg:justify-start w-full lg:w-auto z-10">
                <a href="index.html"><img src="logo.png" alt="Logo" class="h-10 sm:h-16 lg:h-24 w-auto object-contain hover:scale-105 transition-transform"></a>
            </div>
            <div class="w-full lg:absolute lg:inset-x-0 text-center pointer-events-none lg:px-40 py-1">
                <span class="block text-[10px] sm:text-xs font-black uppercase tracking-[0.3em] text-brand-gold mb-1">Grid Directory</span>
                <h1 class="text-2xl sm:text-3xl lg:text-5xl font-black uppercase tracking-wider text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.2)]">Racer Profiles</h1>
            </div>
            <div id="userNav" class="absolute right-3 top-3 lg:relative lg:right-auto lg:top-auto z-10 flex flex-col sm:flex-row items-end sm:items-center gap-2"></div>
        </div>
        <div id="userNavMobile" class="flex sm:hidden flex-col items-center justify-center gap-2 mt-3 px-4 z-10 w-full"></div>
    </header>

    <!-- SUB-NAVBAR -->
    <nav class="bg-brand-bg border-b border-brand-border py-3">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 text-xs font-bold uppercase tracking-wider">
            <a href="index.html" class="text-gray-300 hover:text-brand-gold transition">GSR Main Menu</a>
            <a href="pro_plus.html" class="text-gray-300 hover:text-brand-gold transition">Pro Plus Hub</a>
            <a href="racetracks.html" class="text-gray-300 hover:text-brand-gold transition">Racetracks</a>
            <a href="racers.html" class="text-gray-300 hover:text-brand-gold transition">Racers Hub</a>
            <a href="racers_profiles.html" class="text-brand-gold transition underline decoration-2 underline-offset-4">Racer Profile</a>
            <a href="leaderboards.html" class="text-gray-300 hover:text-brand-gold transition">Racer Leaderboard</a>
            <a href="teams.html" class="text-gray-300 hover:text-brand-gold transition">Teams</a>
            <a href="multimedia.html" class="text-gray-300 hover:text-brand-gold transition">Multi Media</a>
            <a href="chats.html" class="text-gray-300 hover:text-brand-gold transition">GSR Chats</a>
        </div>
    </nav>

    <main class="flex-grow max-w-[1400px] w-full mx-auto px-4 py-8">
        
        <!-- SEARCH & FILTER CONTROLS -->
        <div class="bg-brand-card border border-brand-border rounded-xl p-6 mb-8 shadow-xl">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="SEARCH DRIVER NAME..." class="flex-grow bg-[#111] border border-brand-border text-xs text-white px-4 py-3 rounded outline-none focus:border-brand-gold transition">
                <select id="teamFilterSelect" onchange="applyFilters()" class="bg-[#111] border border-brand-border text-xs text-gray-400 uppercase font-bold px-4 py-3 rounded outline-none min-w-[200px] cursor-pointer">
                    <option value="ALL">ALL TEAMS</option>
                </select>
            </div>
            
            <!-- A-Z Filter Buttons -->
            <div class="flex flex-wrap justify-center gap-1.5" id="alphabetButtonsContainer"></div>
        </div>

        <!-- 16-CARD RACER DIRECTORY GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" id="racerGrid">
            <div class="col-span-full text-center text-xs text-gray-500 font-mono py-12">[ Connecting to telemetry directory... ]</div>
        </div>
    </main>

    <!-- UNIVERSAL FOOTER -->
    <footer class="bg-brand-card border-t border-brand-border py-8 mt-12 text-center text-xs text-gray-500">
        &copy; 2026 Gentle Storm Racing. Built for Second Life.
    </footer>

    <!-- CENTRAL SHARED ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="gsr-core.js"></script>

    <script>
        let allRacers = [];
        let allTeams = [];
        let selectedLetter = 'ALL';

        async function initRacersDirectory() {
            await initGlobalAuth();
            renderAlphabetButtons();
            await fetchDirectoryData();
        }

        function renderAlphabetButtons() {
            const container = document.getElementById('alphabetButtonsContainer');
            if (!container) return;
            const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
            container.innerHTML = letters.map(letter => {
                const isActive = letter === selectedLetter;
                const activeClasses = 'bg-brand-gold text-black font-black';
                const inactiveClasses = 'bg-[#111] border border-brand-border text-gray-400 hover:text-brand-gold font-bold';
                return `<button onclick="filterByLetter('${letter}')" class="${isActive ? activeClasses : inactiveClasses} text-[10px] px-2.5 py-1 rounded transition cursor-pointer">${letter}</button>`;
            }).join('');
        }

        function filterByLetter(letter) {
            selectedLetter = letter;
            renderAlphabetButtons();
            applyFilters();
        }

        async function fetchDirectoryData() {
            try {
                const { data: racers } = await window.db.from('racers').select('*').order('rating_points', { ascending: false });
                const { data: teams } = await window.db.from('teams').select('id, name');

                if (racers) allRacers = racers;
                if (teams) {
                    allTeams = teams;
                    const select = document.getElementById('teamFilterSelect');
                    if (select) {
                        select.innerHTML = '<option value="ALL">ALL TEAMS</option>';
                        teams.forEach(t => {
                            select.innerHTML += `<option value="${t.id}">${escapeHtml(t.name)}</option>`;
                        });
                    }
                }
                applyFilters();
            } catch(e) {
                console.warn("Error fetching racers directory", e);
            }
        }

        function applyFilters() {
            const searchVal = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            const teamVal = document.getElementById('teamFilterSelect')?.value || 'ALL';

            const filtered = allRacers.filter(r => {
                const name = (r.display_name || '').toLowerCase();
                const matchesSearch = !searchVal || name.includes(searchVal);
                const matchesTeam = teamVal === 'ALL' || String(r.primary_team_id) === String(teamVal) || String(r.team_id) === String(teamVal);
                const matchesLetter = selectedLetter === 'ALL' || name.startsWith(selectedLetter.toLowerCase());
                return matchesSearch && matchesTeam && matchesLetter;
            });

            renderGrid(filtered);
        }

        function renderGrid(racers) {
            const grid = document.getElementById('racerGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const totalSlots = Math.max(16, racers.length);

            for (let i = 0; i < totalSlots; i++) {
                const racer = racers[i];
                if (racer) {
                    const name = racer.display_name || 'Pilot';
                    const carNum = racer.racer_number || racer.car_number || '--';
                    const photo = racer.avatar_url || racer.photo_url || racer.driver_photo;
                    
                    let teamName = 'Independent';
                    if (racer.primary_team_id) {
                        const t = allTeams.find(item => item.id === racer.primary_team_id);
                        if (t) teamName = t.name;
                    } else if (racer.team_name || racer.team) {
                        teamName = racer.team_name || racer.team;
                    }

                    const rawClass = (racer.league_class || racer.class || 'pro').toLowerCase();
                    let classBadge = 'PRO LEAGUE';
                    let classBadgeBg = 'bg-brand-red';

                    if (rawClass === 'pro_plus') {
                        classBadge = 'PRO PLUS';
                        classBadgeBg = 'bg-brand-gold text-black';
                    } else if (rawClass === 'amateur') {
                        classBadge = 'AMATEUR';
                        classBadgeBg = 'bg-gray-600';
                    }

                    const profileUrl = `racer.html?driver=${encodeURIComponent(name)}`;

                    grid.innerHTML += `
                        <div class="bg-[#0a0a0a] border border-brand-border hover:border-brand-gold rounded-xl p-4 flex flex-col justify-between group shadow-md transition">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="${classBadgeBg} text-white text-[8px] font-black uppercase px-2 py-0.5 rounded tracking-wider">${classBadge}</span>
                                    <span class="text-brand-red font-mono font-black text-xs">#${carNum}</span>
                                </div>
                                <div class="aspect-square bg-[#111] rounded-lg border border-brand-border flex items-center justify-center mb-4 group-hover:border-brand-gold transition cursor-pointer overflow-hidden" onclick="window.location='${profileUrl}'">
                                    ${photo ? `<img src="${photo}" alt="${escapeHtml(name)}" class="w-full h-full object-cover">` : `<span class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">DRIVER PHOTO</span>`}
                                </div>
                                <h3 class="text-sm font-black uppercase text-white tracking-wider truncate" title="${escapeHtml(name)}">${escapeHtml(name)}</h3>
                                <span class="text-[9px] text-gray-500 uppercase mt-1 block tracking-wider truncate">Team: <span class="text-gray-300">${escapeHtml(teamName)}</span></span>
                            </div>
                            <a href="${profileUrl}" class="mt-4 block w-full text-center bg-[#111] border border-brand-gold text-brand-gold hover:bg-brand-gold hover:text-black transition text-[9px] font-black uppercase py-2.5 rounded tracking-widest">VIEW FULL PROFILE →</a>
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <div class="bg-[#0a0a0a] border border-brand-border rounded-xl p-4 flex flex-col justify-between opacity-50">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="bg-[#1a1a1a] text-gray-500 text-[8px] font-black uppercase px-2 py-0.5 rounded border border-brand-border">ROOKIE</span>
                                    <span class="text-gray-600 font-mono font-black text-xs">#--</span>
                                </div>
                                <div class="aspect-square bg-[#111] rounded-lg border border-brand-border flex items-center justify-center mb-4">
                                    <span class="text-[9px] text-gray-700 font-bold uppercase tracking-widest">OPEN SLOT</span>
                                </div>
                                <h3 class="text-sm font-black uppercase text-gray-500 tracking-wider">PENDING DRIVER</h3>
                                <span class="text-[9px] text-gray-600 uppercase mt-1 block h-3"></span>
                            </div>
                            <div class="mt-4 block w-full text-center bg-[#111] border border-brand-border/40 text-gray-600 text-[9px] font-black uppercase py-2.5 rounded tracking-widest cursor-default">SLOT AVAILABLE</div>
                        </div>
                    `;
                }
            }
        }

        window.onload = initRacersDirectory;
    </script>
</body>
</html>
