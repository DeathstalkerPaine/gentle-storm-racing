<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSRacing Magazine | Gentle Storm Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { bg: '#121212', card: '#1a1a1a', border: '#333333', gold: '#c5a059', red: '#ff2a2a', blue: '#2a75ff' } } } } }
    </script>
    <style>
        .gold-border-glow { border: 1px solid #c5a059; box-shadow: 0 0 20px rgba(197, 160, 89, 0.25); }
        .magazine-page { background: #18181b; background-image: radial-gradient(circle at 50% 50%, #202025 0%, #121212 100%); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-bg text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-brand-card border-b border-brand-gold relative py-4 lg:py-8 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 relative flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center gap-4">
                <a href="multimedia.html" class="bg-brand-bg border border-brand-border hover:border-brand-gold text-white font-bold uppercase text-xs px-3 py-2 rounded transition">
                    ← Multi-Media Hub
                </a>
                <div>
                    <span class="block text-[9px] font-black uppercase tracking-[0.3em] text-brand-gold">GSRacing Publication</span>
                    <h1 class="text-xl sm:text-2xl font-black uppercase text-white tracking-wide">GSRacing Magazine</h1>
                </div>
            </div>

            <!-- ISSUE SELECTOR DROPDOWN (Add future months here) -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label for="issueSelect" class="text-[10px] font-bold uppercase text-gray-400 tracking-widest whitespace-nowrap">Select Issue:</label>
                <select id="issueSelect" onchange="switchIssue(this.value)" class="w-full md:w-56 bg-brand-bg border border-brand-gold text-white font-black uppercase text-xs px-3 py-2.5 rounded-lg outline-none cursor-pointer">
                    <option value="oct_2026">October 2026 (Volume 1)</option>
                    <option value="nov_2026" disabled>November 2026 (Upcoming)</option>
                </select>
            </div>

        </div>
    </header>

    <!-- SUB-NAVBAR -->
    <nav class="bg-brand-bg border-b border-brand-border py-2.5">
        <div class="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-center gap-6 text-xs font-bold uppercase tracking-wider">
            <a href="multimedia.html" class="text-gray-300 hover:text-brand-gold transition">Media Hub</a>
            <a href="magazine.html" class="text-brand-gold transition">Digital Magazine</a>
            <a href="news.html" class="text-gray-300 hover:text-brand-gold transition">News Desk</a>
            <a href="videos.html" class="text-gray-300 hover:text-brand-gold transition">Video Archives</a>
            <a href="photos.html" class="text-gray-300 hover:text-brand-gold transition">Photo Gallery</a>
        </div>
    </nav>

    <!-- MAIN MAGAZINE READER CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 flex flex-col justify-center items-center space-y-6">

        <!-- SPREAD VIEWER BOX -->
        <div class="w-full max-w-6xl bg-brand-card border border-brand-gold rounded-xl overflow-hidden shadow-2xl gold-border-glow grid grid-cols-1 md:grid-cols-2 relative min-h-[550px]">
            
            <!-- LEFT PAGE -->
            <div id="leftPage" class="magazine-page p-8 sm:p-12 flex flex-col justify-between border-b md:border-b-0 md:border-r border-brand-border/60 relative">
                <!-- Content injected via JS -->
            </div>

            <!-- RIGHT PAGE -->
            <div id="rightPage" class="magazine-page p-8 sm:p-12 flex flex-col justify-between relative">
                <!-- Content injected via JS -->
            </div>

        </div>

        <!-- CONTROLS & PAGE FLIPPER FOOTER -->
        <div class="w-full max-w-6xl flex items-center justify-between bg-brand-card border border-brand-border p-4 rounded-xl shadow-lg">
            
            <button onclick="prevSpread()" id="prevBtn" class="bg-brand-bg border border-brand-border hover:border-brand-gold text-white font-black text-xs uppercase px-6 py-3 rounded transition disabled:opacity-30 disabled:cursor-not-allowed">
                ← Previous Page
            </button>

            <div class="text-center">
                <span id="pageIndicator" class="text-xs font-black uppercase text-brand-gold tracking-widest font-mono">Page 1-2 of 6</span>
                <span class="block text-[9px] text-gray-500 uppercase font-bold mt-0.5">Gentle Storm Racing Official Publication</span>
            </div>

            <button onclick="nextSpread()" id="nextBtn" class="bg-brand-gold hover:bg-yellow-600 text-black font-black text-xs uppercase px-6 py-3 rounded transition shadow-md disabled:opacity-30 disabled:cursor-not-allowed">
                Next Page →
            </button>

        </div>

    </main>

    <!-- MAGAZINE CONTENT ENGINE JAVASCRIPT -->
    <script>
        // ADMIN-READY DATA REPOSITORY: Edit pages easily here or connect to a database later!
        const magazineData = {
            oct_2026: [
                // Spread 0 (Pages 1 & 2)
                {
                    left: `
                        <div>
                            <span class="text-[9px] font-black uppercase tracking-widest text-brand-red bg-brand-red/10 border border-brand-red/30 px-2 py-1 rounded inline-block mb-4">Volume 1 • Issue 1</span>
                            <h2 class="text-3xl sm:text-4xl font-black uppercase text-white font-serif italic mb-4">GSRACING MAGAZINE</h2>
                            <p class="text-xs text-gray-300 leading-relaxed mb-6">
                                Welcome to the official monthly publication of Gentle Storm Racing. As our Second Life racing ecosystem expands into Pro Plus campaign integration, this magazine serves as your official briefing on upcoming tracks, team standings, and technical telemetry breakdowns.
                            </p>
                        </div>
                        <div class="border-t border-brand-border pt-4 text-[10px] text-gray-500 font-bold uppercase">
                            Published by GSR Media Group • October 2026
                        </div>
                    `,
                    right: `
                        <div class="space-y-4">
                            <span class="text-[9px] font-black uppercase text-brand-gold tracking-widest">Editor's Note</span>
                            <h3 class="text-xl font-black uppercase text-white">Pushing the Limits of Second Life Physics</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                "When we set out to build Gentle Storm Racing, our goal wasn't just to make another racing track in Second Life. We wanted to build a living, breathing competitive ecosystem. With our Cloudflare and Supabase database integration firing live telemetry every second, drivers aren't just racing—they are writing history into a permanent global leaderboard."
                            </p>
                            <p class="text-[11px] font-bold text-white uppercase mt-4">— Deathstalker Paine, Lead Developer</p>
                        </div>
                    `
                },
                // Spread 1 (Pages 3 & 4)
                {
                    left: `
                        <div class="space-y-4">
                            <span class="text-[9px] font-black uppercase text-brand-blue tracking-widest">Circuit Spotlight</span>
                            <h3 class="text-2xl font-black uppercase text-white">Mastering Ancient Rome</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                The 5.2 KM Ancient Rome circuit remains one of the most punishing tracks in the GSR championship. With its sweeping stone colosseum curves and tight cobblestone aqueduct hairpins, heavy braking precision is valued far above raw horsepower.
                            </p>
                            <div class="bg-brand-bg border border-brand-border p-4 rounded-lg space-y-1">
                                <span class="text-[9px] font-bold text-brand-gold uppercase block">Track Record Holder</span>
                                <span class="text-xs font-black text-white">Vortex_SL — 1:18.900</span>
                            </div>
                        </div>
                    `,
                    right: `
                        <div class="space-y-4">
                            <span class="text-[9px] font-black uppercase text-brand-gold tracking-widest">Pro Plus Career Mode</span>
                            <h3 class="text-2xl font-black uppercase text-white">The Morality System Explained</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                In Pro Plus, your reputation precedes you. Drivers who maintain clean racing lines earn Good alignment status, unlocking elite pit crew bonuses. Those who trade paint and dominate through aggressive contact lean into Bad alignment, unlocking specialized high-risk telemetry perks.
                            </p>
                            <p class="text-xs text-gray-300 italic">"Choose your path carefully when Chapter 1 launches next month."</p>
                        </div>
                    `
                },
                // Spread 2 (Pages 5 & 6)
                {
                    left: `
                        <div class="space-y-4">
                            <span class="text-[9px] font-black uppercase text-brand-red tracking-widest">Team Standings</span>
                            <h3 class="text-2xl font-black uppercase text-white">Storm Riders Take Early Lead</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                Dominating the Pro Plus standings, the Storm Riders syndicate has secured an early 2,000-point lead over the Neon Syndicate. Can anyone close the gap before the mid-season championship?
                            </p>
                        </div>
                    `,
                    right: `
                        <div class="space-y-4 text-center flex flex-col justify-center h-full">
                            <span class="text-4xl">🏁</span>
                            <h3 class="text-2xl font-black uppercase text-white">See You On The Grid</h3>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                Thank you for reading Volume 1 of GSR Digital Magazine. Check back next month for Volume 2 featuring the Winter Track Expansion preview!
                            </p>
                            <div class="pt-4">
                                <a href="racetracks.html" class="inline-block bg-brand-gold text-black font-black uppercase text-xs px-6 py-3 rounded shadow transition">
                                    Explore Racetracks Hub →
                                </a>
                            </div>
                        </div>
                    `
                }
            ]
        };

        let currentSpread = 0;
        let currentIssue = 'oct_2026';

        function renderMagazine() {
            const spreads = magazineData[currentIssue];
            const spreadData = spreads[currentSpread];

            document.getElementById('leftPage').innerHTML = spreadData.left;
            document.getElementById('rightPage').innerHTML = spreadData.right;

            // Update Page Indicator text (e.g., Pages 1-2 of 6)
            const startPage = (currentSpread * 2) + 1;
            const endPage = Math.min(startPage + 1, spreads.length * 2);
            document.getElementById('pageIndicator').innerText = `Page ${startPage}-${endPage} of ${spreads.length * 2}`;

            // Update Button States
            document.getElementById('prevBtn').disabled = currentSpread === 0;
            document.getElementById('nextBtn').disabled = currentSpread === spreads.length - 1;
        }

        function nextSpread() {
            const spreads = magazineData[currentIssue];
            if (currentSpread < spreads.length - 1) {
                currentSpread++;
                renderMagazine();
            }
        }

        function prevSpread() {
            if (currentSpread > 0) {
                currentSpread--;
                renderMagazine();
            }
        }

        function switchIssue(issueKey) {
            if (magazineData[issueKey]) {
                currentIssue = issueKey;
                currentSpread = 0;
                renderMagazine();
            }
        }

        // Initialize on load
        window.onload = () => {
            renderMagazine();
        };
    </script>

    <!-- UNIVERSAL FOOTER -->
    <footer class="bg-brand-card border-t border-brand-border py-8 mt-12 text-center text-xs text-gray-500">
        &copy; 2026 Gentle Storm Racing. Built for Second Life.
    </footer>
</body>
</html>
